<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<title>Cuentos y Tarjetas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE; --paper:#FFFDF9; --ink:#2B2420; --muted:#8A7F76; --line:#EADFD0;
  --terra:#C8553D; --terra-d:#A8432E; --teal:#1F6F6B; --teal-l:#E3F0EE; --sun:#E9A23B; --sun-l:#FCEFD6;
  --sky:#3B6FB6; --sky-l:#E4ECF7; --red:#C0392B; --green:#2E8B57;
  --r:18px; --shadow:0 1px 2px rgba(43,36,32,.06),0 6px 20px rgba(43,36,32,.07);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-size:16px;line-height:1.5}
.es{font-family:Lora,Georgia,serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:calc(10px + var(--safe-t)) 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-family:Lora,serif;font-weight:600;font-size:18px;letter-spacing:.2px}
.brand span{color:var(--terra)}
#hdr-level{font-size:13px;background:var(--paper);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
#main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
body.immersive header,body.immersive #nav{display:none}
body.immersive #main{padding-top:calc(12px + var(--safe-t))}
#nav{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;justify-content:space-around;background:var(--paper);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--muted);border-radius:12px}
#nav button i{font-style:normal;font-size:21px;line-height:1}
#nav button.on{color:var(--terra);font-weight:500}
#nav button.on i{transform:translateY(-1px)}
.h{font-size:24px;margin:4px 0 14px}
.h3{font-size:17px;margin:24px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.3px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font-weight:500;margin-top:10px;text-align:center;text-decoration:none;min-height:46px}
.btn.big{padding:16px;font-size:17px}
.btn.small{padding:8px 12px;font-size:14px;min-height:38px;width:auto;display:inline-block;margin:4px}
.btn.primary{background:var(--terra);color:#fff;box-shadow:0 4px 14px rgba(200,85,61,.28)}
.btn.primary:active{background:var(--terra-d)}
.btn.primary:disabled{background:#D9CFC4;box-shadow:none;color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.icon{background:var(--paper);border:1px solid var(--line);width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;font-size:18px;flex:none}
.icon.big{width:54px;height:54px;font-size:22px;background:var(--teal);color:#fff;border:0}
.icon.inline{width:30px;height:30px;font-size:14px;vertical-align:middle}
section{animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* welcome */
.hero{padding:28px 6px 10px}
.hero-badge{display:inline-block;background:var(--sun-l);color:#8a5a10;padding:5px 12px;border-radius:99px;font-family:Lora,serif;font-style:italic}
.hero h1{font-family:Lora,serif;font-size:34px;line-height:1.15;margin:14px 0 8px}
.how{list-style:none;padding:0;margin:20px 0}
.how li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
/* home */
.today{background:var(--paper);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.today-top{display:flex;justify-content:space-between;align-items:flex-start}
.today-title{font-size:20px;font-weight:700}
.streak{background:var(--sun-l);border-radius:99px;padding:5px 12px;font-weight:700}
.stats3,.card-sum,.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.card-sum{grid-template-columns:1fr 1fr}
.grid4{grid-template-columns:1fr 1fr}
.stats3>div,.card-sum>div,.grid4>div{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.grid4>div{background:var(--paper);box-shadow:var(--shadow)}
.stats3 b,.card-sum b,.grid4 b{display:block;font-size:24px;line-height:1.2}
.stats3 span,.card-sum span,.grid4 span{font-size:12px;color:var(--muted)}
.next-story{margin-top:14px;background:var(--teal);color:#fff;border-radius:var(--r);padding:18px;cursor:pointer}
.next-story .eyebrow,.next-story .muted{color:#cfe6e3}
.ns-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.ns-title{font-size:22px;font-weight:600}
.ns-go{font-size:30px}
.banner{margin-top:14px;background:var(--sun-l);border-radius:var(--r);padding:16px}
.banner p{margin:4px 0 0}
.tip{margin-top:14px;font-size:14px;color:var(--muted);padding:0 4px}
/* cards hub */
.modes{display:grid;gap:8px}
.mode{display:flex;gap:12px;align-items:center;text-align:start;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.mode .mi{font-size:22px}
.mode small{display:block;color:var(--muted)}
.mode.on{border-color:var(--terra);background:#FFF5F1}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.fill.known{background:var(--teal)} .fill.stable{background:var(--green)} .fill.learning{background:var(--sun)} .fill.new{background:var(--sky)}
.wl{margin-top:10px;background:var(--paper);border-radius:14px;overflow:hidden}
.wl-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:99px}
.tag.new{background:var(--sky-l);color:var(--sky)} .tag.learning{background:var(--sun-l);color:#8a5a10} .tag.stable{background:#E2F2E8;color:var(--green)} .tag.known{background:var(--teal-l);color:var(--teal)}
/* session */
.ses-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--terra);border-radius:99px;transition:width .3s}
.flash{position:relative;background:var(--paper);border-radius:22px;box-shadow:var(--shadow);min-height:46vh;padding:34px 20px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:rise .2s ease}
.flash.is-new{border-top:5px solid var(--sky)}
.newtag{position:absolute;top:12px;inset-inline-start:14px;font-size:12px;background:var(--sky-l);color:var(--sky);padding:2px 10px;border-radius:99px}
.f-word{font-size:38px;font-weight:600;line-height:1.2;margin-bottom:14px;word-break:break-word}
.f-word.en{font-family:Rubik,sans-serif;font-size:30px}
.spk{margin:0 auto}
.divider{height:1px;background:var(--line);margin:18px 0}
.b-word{font-size:24px;font-weight:500}
.b-word.en{font-family:Rubik,sans-serif}
.ctx{margin:16px 0 8px;font-size:18px;line-height:1.6;background:var(--bg);border-radius:12px;padding:12px;text-align:left}
mark{background:var(--sun-l);color:inherit;padding:0 3px;border-radius:4px;font-weight:600}
.ctx-en{text-align:left;font-size:14px;color:var(--muted);margin-bottom:8px}
.ctx-en summary{text-align:right;cursor:pointer}
.ses-actions{margin-top:14px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grade{border:0;border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;color:#fff}
.grade b{font-size:15px}
.grade small{font-size:11px;opacity:.9}
.g1{background:var(--red)} .g2{background:#D9822B} .g3{background:var(--green)} .g4{background:var(--sky)}
.done{text-align:center;padding:40px 10px}
.done-emoji{font-size:56px}
.done h2{font-family:Lora,serif;font-size:30px;margin:8px 0}
/* stories */
.gen{background:var(--paper);border:1.5px dashed var(--sun);border-radius:var(--r);padding:14px}
.gen-head{display:flex;flex-direction:column;gap:2px}
.gen-row{display:flex;gap:8px;margin-top:10px}
.gen-row input{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--bg);min-width:0}
.gen-row .btn{width:auto;margin:0;padding:10px 18px}
.slist{display:grid;gap:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.srow.read{background:#F7FBF9;border-color:#CFE3DA}
.sr-title{font-size:18px;font-weight:600}
.sr-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.score{color:var(--green);font-weight:700;font-size:14px}
.ai{font-family:Rubik;font-size:10px;background:var(--sun-l);color:#8a5a10;padding:1px 6px;border-radius:99px;vertical-align:middle}
/* reader */
.r-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:6px}
.r-title{font-size:26px;margin:2px 0 0;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;margin:10px 0 6px;color:var(--ink)}
.lg{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:4px}
.lg.tgt{background:var(--sky)} .lg.lrn{background:var(--sun)}
.story{background:var(--paper);border-radius:var(--r);padding:18px 18px 8px;box-shadow:var(--shadow);margin-top:8px}
.para{position:relative;margin-bottom:14px}
.para p{font-size:19.5px;line-height:1.8;margin:0;text-align:left}
.w{border-radius:4px;padding:1px 0;cursor:pointer}
.w.tgt{border-bottom:2.5px solid var(--sky)}
.w.lrn{border-bottom:2.5px solid var(--sun)}
.w.sel{background:var(--terra);color:#fff;border-bottom-color:transparent}
.sent{transition:background .2s}
.sent.cur{background:var(--teal-l);border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tr-btn{display:block;margin:6px 0 0 auto;margin-inline-start:0;background:none;border:1px solid var(--line);border-radius:99px;font-size:11px;padding:2px 10px;color:var(--muted)}
.tr-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tr{font-size:15px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:6px;line-height:1.55;text-align:left}
.quiz{margin-top:8px}
.q{background:var(--paper);border-radius:14px;padding:14px;margin-bottom:10px}
.q-t{font-weight:600;font-size:17px;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;margin-top:7px;font-size:16px;min-height:46px}
.opt.right{background:#E2F2E8;border-color:var(--green)}
.opt.wrong{background:#FBE5E1;border-color:var(--red)}
.opt.nose{text-align:center;color:var(--muted);background:transparent;border-style:dashed;font-family:Rubik}
.res{background:var(--paper);border-radius:var(--r);padding:18px;text-align:center;box-shadow:var(--shadow)}
.res-score{font-size:40px;font-weight:700;color:var(--teal)}
.player{position:fixed;bottom:calc(64px + var(--safe-b));inset-inline:0;margin:0 auto;max-width:420px;width:calc(100% - 24px);background:var(--ink);color:#fff;border-radius:99px;padding:7px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.player .icon:not(.big){background:transparent;color:#fff;border-color:#5a4f48}
.rates{display:flex;gap:4px}
.rate{background:transparent;border:1px solid #5a4f48;color:#ddd;border-radius:99px;padding:6px 10px;font-size:13px}
.rate.on{background:#fff;color:var(--ink);border-color:#fff}
/* word sheet */
#scrim{position:fixed;inset:0;background:rgba(43,36,32,.18);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:9;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.15);padding:8px 18px calc(18px + var(--safe-b));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
#sheet.on{transform:none}
.grip{width:40px;height:5px;background:var(--line);border-radius:99px;margin:4px auto 12px}
.ws-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ws-word{font-size:30px;font-weight:600;line-height:1.1}
.ws-top .spk{margin:0}
.ws-gloss{font-size:20px;margin:10px 0 4px;text-align:left}
.ws-ai{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ws-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ws-acts .btn{margin:0}
.indeck{display:grid;place-items:center;background:var(--teal-l);color:var(--teal);border-radius:14px;font-size:14px;font-weight:500;padding:8px;text-align:center}
/* placement */
.pt{padding-top:10px}
.pt-s{font-size:24px;line-height:1.5;margin:14px 0 18px;background:var(--paper);padding:20px;border-radius:var(--r);box-shadow:var(--shadow);text-align:left}
.pt-pass{font-size:18px;line-height:1.65;background:var(--paper);padding:16px;border-radius:var(--r);margin:12px 0;box-shadow:var(--shadow);text-align:left}
.pt-q{font-weight:600;font-size:18px;margin-bottom:6px;text-align:left}
.pt-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.pt-res div{background:var(--paper);border-radius:12px;padding:10px}
.pt-res span{display:block;font-size:12px;color:var(--muted)}
/* progress */
.lvl-card{display:flex;gap:14px;align-items:center;background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.lvl-icon{font-size:42px}
.lvl-name{font-size:22px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:12px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.settings{background:var(--paper);border-radius:var(--r);padding:4px 14px;box-shadow:var(--shadow)}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);min-height:52px}
.set:last-of-type{border-bottom:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px}
.tgl{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.tgl.on{background:var(--teal)}
.tgl.on i{inset-inline-start:23px}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px monospace;margin-bottom:10px;background:var(--bg)}
#toast{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translate(-50%,-80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;transition:transform .25s;pointer-events:none;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}

/* v2: practice days, card context, verbs */
.streak small{font-weight:400;font-size:12px;color:#8a5a10}
.ctx-wrap{margin:14px 0 8px}
.ctx-wrap .ctx{margin:0}
.ctx .w{cursor:pointer;border-radius:4px}
.ctx .w.hit{background:var(--sun-l);font-weight:600;padding:0 3px}
.ctx .w.sel{background:var(--terra);color:#fff}
.en-ctx{font-family:Rubik,sans-serif;font-size:16px;color:var(--ink)}
.ctx-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;justify-content:center}
.pill{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;min-height:34px}
.cj-drill{background:var(--paper);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 12px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip small{font-size:11px;color:var(--muted)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on small{color:#cfe6e3}
.seg.two{grid-template-columns:repeat(3,1fr);margin-top:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;font-size:14px}
.tab small{font-size:11px;color:var(--muted)}
.tab.on{border-color:var(--terra);background:#FFF5F1}
.tense-card{background:var(--paper);border-radius:var(--r);padding:16px;margin-top:10px;box-shadow:var(--shadow)}
.tense-card p{margin:8px 0;font-size:15px}
.tc-head{display:flex;justify-content:space-between;align-items:center}
.tc-name{font-size:22px;font-weight:600}
.tc-form{background:var(--bg);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.7;text-align:left}
.tc-ex{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:17px;margin-top:10px;text-align:left}
.verb-pick{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 8px;padding:0 16px 6px;scrollbar-width:none}
.vchip{flex:none;font-family:Lora,serif;border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:15px}
.vchip.irr{border-style:dashed}
.vchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.conj-table{background:var(--paper);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.ct-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ct-row{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;column-gap:10px}
.ct-p{color:var(--muted);font-size:15px}
.ct-f{font-size:19px;font-weight:600;color:var(--teal);text-align:right}
.ct-he{grid-column:1/3;font-size:11px;color:var(--muted);text-align:left}
.cjq{padding-top:6px}
.cj-meta{display:flex;gap:8px;align-items:center}
.cj-verb{font-size:26px;font-weight:600;margin:14px 0 4px;text-align:left}
.cj-sent{font-size:22px;line-height:1.6;background:var(--paper);padding:18px;border-radius:var(--r);box-shadow:var(--shadow);margin:10px 0 6px;text-align:left}
.blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--terra);color:var(--terra);font-weight:600;text-align:center}
.blank.ok{color:var(--green);border-color:var(--green)} .blank.bad{color:var(--red);border-color:var(--red)}

    { es: "Tomás llega a Cusco a las seis de la mañana. Está muy cansado porque el bus de Lima tardó veinte horas. Tiene una mochila grande y una mochila pequeña. Camina despacio por las calles porque la ciudad está muy alta y el aire es diferente.",

      en: "At the hostel, a girl at reception gives him a key. \"Your room is on the third floor,\" she tells him. \"You share it with three people.\" Tomás has to climb a lot of stairs with the backpack. When he gets to the room, he is even more tired." },

{
  id: "s2", level: 1, title: "El mercado de La Paz", titleEn: "The market in La Paz",
  paragraphs: [
    { es: "Hoy es sábado y Lucía quiere cocinar para sus amigos. Va al mercado con una bolsa grande. El mercado está lleno de gente, colores y olores. Hay frutas que Lucía no conoce y señoras que venden de todo.",

    { es: "—¿Cuánto cuestan las papas? —pregunta Lucía. —Cinco bolivianos el kilo, señorita —dice una señora. Lucía compra dos kilos de papas, cebollas y tomates. Después busca carne, pero no la encuentra. Le pregunta a un niño y él le muestra el lugar.",
      en: "\"How much are the potatoes?\" Lucía asks. \"Five bolivianos a kilo, miss,\" says a lady. Lucía buys two kilos of potatoes, onions and tomatoes. Then she looks for meat, but she can't find it. She asks a boy and he shows her the place." },
    { es: "Al final, Lucía ve una fruta rara, verde por fuera y blanca por dentro. —Es chirimoya —dice el vendedor—. Pruébela. Lucía la prueba y le encanta. Es dulce y suave. Compra cuatro para el postre.",

    { es: "Andrés tiene que viajar de Mendoza a Buenos Aires. El viaje dura catorce horas, así que compra un pasaje para el bus de noche. Elige un asiento al lado de la ventana porque quiere ver el paisaje antes de dormir.",
      en: "Andrés has to travel from Mendoza to Buenos Aires. The trip lasts fourteen hours, so he buys a ticket for the night bus. He chooses a seat next to the window because he wants to see the landscape before sleeping." },
    { es: "El bus sale a las ocho. Al lado de Andrés se sienta un señor mayor con un sombrero. El señor no habla mucho, pero le ofrece unas galletas. —Gracias —dice Andrés—. ¿Usted también va a Buenos Aires? —No, me bajo en Córdoba. Voy a visitar a mi hija.",
      en: "The bus leaves at eight. An older man with a hat sits down next to Andrés. The man doesn't talk much, but he offers him some cookies. \"Thanks,\" says Andrés. \"Are you also going to Buenos Aires?\" \"No, I get off in Córdoba. I'm going to visit my daughter.\"" },
    { es: "A medianoche, el bus para en una estación pequeña. Andrés baja para comprar agua. Hace frío y está muy oscuro. Cuando vuelve, no encuentra su celular. Lo busca en el asiento, debajo del asiento y en la mochila. Nada.",
      en: "At midnight, the bus stops at a small station. Andrés gets off to buy water. It's cold and very dark. When he comes back, he can't find his phone. He looks for it on the seat, under the seat and in the backpack. Nothing." },
    { es: "Entonces el señor del sombrero le toca el brazo y le muestra algo: es el celular. —Se le cayó cuando bajó —dice. Andrés le da las gracias muchas veces. Después duerme tranquilo hasta la mañana, cuando el sol ya entra por la ventana.",
      en: "Then the man with the hat touches his arm and shows him something: it's the phone. \"You dropped it when you got off,\" he says. Andrés thanks him many times. Then he sleeps peacefully until morning, when the sun is already coming in through the window." }

    { es: "Cuando Camila vivía en Bogotá, trabajaba en una oficina gris desde las ocho hasta las seis. Siempre estaba cansada y casi nunca veía el sol. Hace un año, su empresa le permitió trabajar desde cualquier lugar, y ella decidió mudarse a Medellín.",

    { es: "Mateo y su hermana Sofía habían planeado la caminata durante meses. Querían recorrer el circuito W en Torres del Paine, en la Patagonia chilena. El primer día hacía un tiempo increíble: el cielo estaba despejado y los lagos brillaban como espejos.",

    { es: "El segundo día, sin embargo, el viento empezó a soplar con mucha fuerza. Un guardaparque les advirtió que se acercaba una tormenta. —Si siguen hasta el mirador, tengan cuidado —les dijo—. El camino se pone peligroso con la lluvia.",

    { es: "Sofía quería seguir, pero Mateo tenía dudas. Discutieron unos minutos y finalmente decidieron esperar en el refugio. Fue una buena decisión: una hora después, llovía tanto que no se veía nada. En el refugio había otros viajeros, y todos compartían té y chocolate.",
      en: "Sofía wanted to keep going, but Mateo had doubts. They argued for a few minutes and finally decided to wait in the shelter. It was a good decision: an hour later, it was raining so hard you couldn't see anything. In the shelter there were other travelers, and everyone was sharing tea and chocolate." },

{

  paragraphs: [
    { es: "Todos los domingos, cuando Diego era niño, su familia comía en la casa de su abuela en Oaxaca. Ella preparaba mole negro, un plato que tardaba casi todo el día en cocinarse. Diego se sentaba en la cocina y la miraba mezclar chiles, chocolate y especias.",

    { es: "La abuela nunca usaba recetas escritas. —La receta está aquí —decía, y se tocaba el corazón. Diego le hacía preguntas, pero ella solo se reía y le daba una cuchara para probar la salsa.",
      en: "Grandma never used written recipes. \"The recipe is here,\" she would say, touching her heart. Diego would ask her questions, but she just laughed and gave him a spoon to taste the sauce." },
    { es: "Hace dos años la abuela se enfermó y ya no podía cocinar. Diego se dio cuenta de que nadie en la familia sabía hacer el mole. Entonces decidió aprender. Pasó muchas tardes con ella, anotando cada paso en un cuaderno mientras ella le explicaba con paciencia.",

{
  id: "s7", level: 3, title: "La tortuga de San Cristóbal", titleEn: "The tortoise of San Cristóbal",
  paragraphs: [
    { es: "Cuando Inés llegó a la isla San Cristóbal para trabajar como voluntaria, no se imaginaba que aquella experiencia le cambiaría la vida. La organización le había pedido que se encargara de contar las tortugas de una zona remota, una tarea que parecía sencilla pero que exigía una paciencia enorme.",
      en: "When Inés arrived on San Cristóbal island to work as a volunteer, she didn't imagine that the experience would change her life. The organization had asked her to take charge of counting the tortoises in a remote area, a task that seemed simple but required enormous patience." },
    { es: "Cada mañana, antes de que el sol calentara demasiado, recorría senderos llenos de piedras volcánicas. Era imprescindible que registrara cada tortuga con precisión: su tamaño, su ubicación y cualquier herida que tuviera. Al principio le costaba distinguirlas, pero poco a poco aprendió a reconocer a cada una.",
      en: "Every morning, before the sun got too hot, she walked along trails full of volcanic rocks. It was essential that she record each tortoise precisely: its size, its location and any injury it had. At first she found it hard to tell them apart, but little by little she learned to recognize each one." },

/* ============ cloud init ============ */
function withTimeout(p, ms) { return Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]); }
async function initCloud() {

  // optional capabilities in parallel
  claude.use("sample").then(s => { Store.sample = s; if (s) rerenderSoft(); }).catch(() => { });
  claude.use("tts").then(t => { Store.ttsCap = t; }).catch(() => { });
  try {
    const [db, user] = await withTimeout(Promise.all([claude.use("db"), claude.use("user")]), 10000) || [];
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    Store.db = db;
    Store.col = db.collection("data/users/" + uid);
    const snap = await withTimeout(Store.col.get(), 10000);
    if (!snap) return;
    let remote = null;
    for (const d of snap.docs) {
      if (!d.exists) continue;
      if (d.id === "state") remote = d.data();
      else if (d.id.startsWith("story_")) { const st = d.data(); if (st && st.id) GEN[st.id] = JSON.parse(JSON.stringify(st)); }
    }
    if (remote && (remote.updated || 0) >= (S.updated || 0)) {
      S = normalize(JSON.parse(JSON.stringify(remote)));
      lsSet("cyt_state", S);
    } else if (S.updated) {
      flush(); // local is newer, push it
    }
    // push generated stories that exist only locally
    for (const id of Object.keys(GEN)) if (!snap.docs.some(d => d.id === "story_" + id)) Store.col.doc("story_" + id).set(GEN[id]).catch(() => { });
    lsSet("cyt_gen", GEN);
    Store.status = "cloud";
    buildDefs();
    if (VIEW === "welcome" && S.placement.done) go("home"); else rerenderSoft();
  } catch (e) { console.warn("cloud init", e); }
}

/* ============ stories & card definitions ============ */
function allStories() {

function buildDefs() {
  DEFS = {}; STORY_FORM = {}; GLOBAL_FORM = {};

    STORY_FORM[st.id] = {};
    const sents = [];
    st.paragraphs.forEach((p, pi) => splitSentences(p.es).forEach(s => sents.push({ s, pi })));
    for (const t of st.targets || []) {
      const id = "c_" + slug(t.es);
      const match = (t.match || []).map(x => String(x).toLowerCase());
      let found = sents.find(x => tokensLower(x.s).some(w => match.includes(w)));
      if (!DEFS[id]) DEFS[id] = { id, es: t.es, en: t.en, storyId: st.id, level: st.level, sentence: found ? found.s : "", pi: found ? found.pi : 0, match, region: st.region || null };
      for (const f of match) { STORY_FORM[st.id][f] = id; if (!GLOBAL_FORM[f] && !AMBIG.has(f)) GLOBAL_FORM[f] = id; }

}

const TTS = { voice: null, synth: "speechSynthesis" in window ? window.speechSynthesis : null, run: 0 };

  const vs = TTS.synth.getVoices().filter(v => /^es([-_]|$)/i.test(v.lang));
  const pref = ["es-AR", "es-CO", "es-US", "es-419", "es-MX", "es-CL", "es-PE", "es-ES"];
  let best = null;
  for (const p of pref) { best = vs.find(v => v.lang.replace("_", "-").toLowerCase() === p.toLowerCase()); if (best) break; }

    return new Promise(res => {
      try {
        TTS.synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        if (TTS.voice) { u.voice = TTS.voice; u.lang = TTS.voice.lang; } else u.lang = "es-MX";
        u.rate = rate;
        let done = false; const fin = () => { if (!done) { done = true; res(); } };
        u.onend = fin; u.onerror = fin;
        TTS.synth.speak(u);
        setTimeout(fin, 3000 + text.length * 180 / rate); // safety on buggy engines
      } catch (e) { res(); }
    });
  }
  if (Store.ttsCap) return Store.ttsCap.speak(text, { language: "es", rate: Math.min(1.5, Math.max(0.7, rate)) }).catch(() => { });

/* ============ gloss lookup ============ */
function lookup(word, story) {
  const w = word.toLowerCase();
  const raw = (story && story.gloss && story.gloss[w]) || GLOSS[w] || S.aiGloss[w] || null;
  if (!raw) return null;
  const [gloss, lemma] = String(raw).split("|").map(x => x && x.trim());
  return { gloss, lemma: lemma || null };
}

/* ============ AI (sample) ============ */
async function askJSON(prompt, tier) {
  const s = Store.sample;
  if (!s) throw new Error("no sample");
  if (typeof s.json === "function") {
    try { const v = await s.json(prompt, { modelTier: tier || "default" }); if (v && typeof v === "object") return v; } catch (e) { if (e && (e.code === "not_granted" || e.code === "rate_limited")) throw e; }
  }
  const r = await s(prompt, { modelTier: tier || "default" });
  const t = (r && r.text) || "";
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a < 0 || b < a) throw new Error("bad json");
  return JSON.parse(t.slice(a, b + 1));
}

  const learned = () => Object.keys(S.cards).filter(id => S.cards[id].st !== "new" && !S.known[id] && getDef(id))
    .sort((a, b) => weakness(b) - weakness(a)).slice(0, 25);
  if (!storyId) {
    if (mode === "new") news = news.slice(0, 10);
    else if (mode === "extra") news = news.slice(0, 5);
    else news = news.slice(0, newRemaining() || (due.length ? 0 : 5));
  }
  let q = [];
  if (storyId) q = due.concat(news);

  else if (mode === "new") q = news;
  else if (mode === "free") q = learned();

async function generateStory() {
  const btn = $("#g-go"), status = $("#g-status");
  const topic = ($("#g-topic").value || "").trim();
  const learning = Object.keys(S.cards).filter(id => ["learning"].includes(cardStatus(id)) || (S.cards[id].st === "review" && S.cards[id].s < 21)).map(getDef).filter(Boolean);
  const pick = shuffle(learning).slice(0, 8).map(d => d.es);
  const avoid = Object.values(DEFS).map(d => d.es).slice(0, 120);
  const spec = { 1: "CEFR A2: present tense, estar+gerund, ir a + infinitive, simple preterite. Short sentences. 140-170 words.", 2: "CEFR B1: add imperfect, present perfect, future, commands. 180-230 words.", 3: "CEFR B2: add subjunctive, conditional, complex sentences. 230-290 words." }[S.level];
  const prompt = `You write a graded reading story for a Spanish learner (Hebrew native speaker who reads English glosses). Use natural, colloquial Latin American Spanish, preferably set in Argentina (with voseo: vos sos, tenés, querés) or Colombia, and include 1-2 common local slang words (e.g. che, re, copado, laburo, bondi, parce, bacano, chévere, ¡de una!), glossed like any other word.
Level: ${spec} Exactly 4 paragraphs. About 97% of the words must be easy for this level.
${pick.length ? `The learner is currently studying these words. Use EACH of them naturally at least once (any inflection): ${pick.join(", ")}.` : ""}
Introduce exactly 6 NEW useful words for this level and repeat each one at least twice in the story. Do not choose any of these as new words: ${avoid.join(", ")}.
Topic: ${topic || "everyday life or travel in Latin America, with a small surprise or problem that gets solved"}.
Return ONLY a JSON object, no markdown:
{"title":"Spanish title","titleEn":"English title","paragraphs":[{"es":"paragraph","en":"natural English translation"}],"targets":[{"es":"dictionary form (nouns with el/la)","en":"short English meaning","match":["each exact lowercase form of this word as it appears in the paragraphs"]}],"gloss":{"<every distinct lowercase word in the paragraphs AND questions>":"short English meaning in context; for conjugated verbs add ' | infinitive'"},"questions":[{"q":"comprehension question in Spanish","options":["a","b","c"],"answer":0}]}
targets must contain only the 6 new words. Write 3 questions. The gloss object must cover every single word form, including articles, names and small words.`;
  btn.disabled = true; status.textContent = "Claude כותב לך סיפור… (בערך דקה)";
  try {
    const j = await askJSON(prompt, "default");
    if (!j || !Array.isArray(j.paragraphs) || !j.paragraphs.length) throw new Error("empty");
    const id = "g" + Date.now();
    const gloss = {};
    for (const [k, v] of Object.entries(j.gloss || {})) gloss[String(k).toLowerCase()] = String(v);
    const st = {
      id, level: S.level, generated: true, created: Date.now(),
      title: String(j.title || "Cuento nuevo"), titleEn: String(j.titleEn || ""),
      paragraphs: j.paragraphs.filter(p => p && p.es).map(p => ({ es: String(p.es), en: String(p.en || "") })),
      targets: (j.targets || []).filter(t => t && t.es).map(t => ({ es: String(t.es), en: String(t.en || ""), match: (t.match || []).map(x => String(x).toLowerCase()) })),
      gloss,
      questions: (j.questions || []).filter(q => q && q.q && Array.isArray(q.options)).map(q => ({ q: String(q.q), options: q.options.map(String), answer: Math.max(0, Math.min(q.options.length - 1, +q.answer || 0)) }))
    };
    GEN[id] = st;
    S.genIds.push(id);
    lsSet("cyt_gen", GEN);
    if (Store.col) Store.col.doc("story_" + id).set(st).catch(e => console.warn(e));
    save(); buildDefs();
    toast("הסיפור מוכן!");
    go("reader", id);
  } catch (e) {
    console.warn(e);
    btn.disabled = false;
    status.textContent = e && e.code === "not_granted" ? "צריך לאשר ל־Claude גישה כדי ליצור סיפורים." : e && e.code === "rate_limited" ? "יותר מדי בקשות, נסה שוב בעוד דקה." : "משהו השתבש ביצירה. נסה שוב.";
  }
}

/* ============ reader ============ */
const Reader = {

      if (!this.playing || run !== TTS.run) return;
      this.mark(i);

function paraOfSentence(st, si) { let k = 0; for (let pi = 0; pi < st.paragraphs.length; pi++) { k += splitSentences(st.paragraphs[pi].es).length; if (si < k) return pi; } return 0; }
function refreshWordMarks() {

/* ============ placement ============ */
let PT = null;
function renderPlacement() {
  if (!PT) PT = { band: 2, streak: 0, asked: new Set(), res: { 1: { c: 0, n: 0 }, 2: { c: 0, n: 0 }, 3: { c: 0, n: 0 } }, n: 0, max: 15, item: null, knownW: [] };
  if (PT.n >= PT.max) return finishPlacement();
  const pool = PLACEMENT.map((x, i) => ({ x, i })).filter(o => o.x.band === PT.band && !PT.asked.has(o.i));
  const pool2 = pool.length ? pool : PLACEMENT.map((x, i) => ({ x, i })).filter(o => !PT.asked.has(o.i));
  if (!pool2.length) return finishPlacement();
  const wantReading = PT.n % 4 === 3;
  const pick = pool2.find(o => !!o.x.r === wantReading) || pool2[Math.floor(Math.random() * pool2.length)];
  PT.item = pick; PT.asked.add(pick.i);
  const it = pick.x;
  const sentence = it.r ? "" : esc(it.s).replace(/\*(.+?)\*/, '<mark>$1</mark>');
  main().innerHTML = `
  <div class="ses-top"><button class="icon" id="pt-x">✕</button><div class="prog"><div style="width:${Math.round(PT.n / PT.max * 100)}%"></div></div><span class="muted small">${PT.n + 1}/${PT.max}</span></div>
  <section class="pt">
    <div class="eyebrow es" dir="ltr">${it.r ? "Lee el texto y responde." : "¿Qué significa la palabra destacada?"}</div>
    ${it.r ? `<div class="pt-pass es" dir="ltr">${esc(it.p)}</div><div class="pt-q es" dir="ltr">${esc(it.q)}</div>` : `<div class="pt-s es" dir="ltr">${sentence}</div>`}
    <div class="pt-opts">${it.opts.map((o, k) => `<button class="opt ${it.r ? "es" : ""}" dir="ltr" data-k="${k}">${esc(o)}</button>`).join("")}
    <button class="opt nose" data-k="-1">No sé · לא יודע</button></div>
  </section>`;
  $("#pt-x").onclick = () => { PT = null; go(S.placement.done ? "progress" : "welcome"); };
  document.querySelectorAll(".pt-opts .opt").forEach(b => b.onclick = () => {
    const ok = +b.dataset.k === it.a;
    const r = PT.res[it.band]; r.n++; if (ok) r.c++;
    if (ok && it.w) PT.knownW.push(it.w);
    if (ok) { PT.streak++; if (PT.streak >= 2 && PT.band < 3) { PT.band++; PT.streak = 0; } }
    else { PT.streak = 0; if (PT.band > 1) PT.band--; }
    PT.n++;
    renderPlacement();
  });
}
function finishPlacement() {
  const res = PT.res;
  let lvl = 1;
  for (const b of [3, 2]) { const r = res[b]; if (r.n >= 2 && r.c / r.n >= 0.7) { lvl = b; break; } }
  if (lvl === 1 && res[2].n >= 3 && res[2].c / res[2].n >= 0.6 && res[1].n && res[1].c / res[1].n >= 0.8) lvl = 2;
  S.level = lvl;
  S.placement = { done: true, date: Date.now(), res };
  for (const w of PT.knownW) { const id = "c_" + slug(w); if (DEFS[id] && DEFS[id].level < lvl) S.known[id] = true; }
  save(); PT = null;
  const L = LV[lvl];
  main().innerHTML = `<section class="done">
    <div class="done-emoji">${L.icon}</div>
    <div class="eyebrow">הרמה שלך</div>
    <h2 class="es" dir="ltr">${L.es} · ${L.cefr}</h2>
    <p>${L.desc}</p>
    <div class="pt-res">${[1, 2, 3].map(b => `<div><span>${LV[b].es}</span><b>${res[b].n ? Math.round(res[b].c / res[b].n * 100) + "%" : "—"}</b></div>`).join("")}</div>
    <p class="muted small">אפשר לשנות רמה ידנית או לעשות את המבחן שוב במסך "התקדמות". האפליקציה תציע לך לעלות רמה כשתהיה מוכן.</p>
    <button class="btn primary big" id="pt-go">יאללה, לסיפור הראשון 📖</button>
  </section>`;
  $("#pt-go").onclick = () => { const nx = nextStory(); nx ? go("reader", nx.id) : go("home"); };
}

  <h2 class="h">התקדמות</h2>
  <section class="lvl-card">
    <div class="lvl-icon">${L.icon}</div>
    <div><div class="eyebrow">רמה נוכחית</div><div class="lvl-name es" dir="ltr">${L.es} · ${L.cefr}</div><div class="muted small">${L.desc}</div></div>
  </section>
  <div class="seg">${[1, 2, 3].map(l => `<button class="${S.level === l ? "on" : ""}" data-l="${l}">${LV[l].icon} ${LV[l].es}</button>`).join("")}</div>
  <button class="btn ghost" id="pg-test">🧪 מבחן רמה מחדש</button>
  <section class="grid4">
    <div><b>${counts.stable + counts.known}</b><span>מילים שנקלטו</span></div>
    <div><b>${counts.learning}</b><span>בלמידה</span></div>
    <div><b>${reads.length}</b><span>סיפורים שנקראו</span></div>
    <div><b>${avg === null ? "—" : avg + "%"}</b><span>ממוצע הבנה</span></div>
  </section>
  <h3 class="h3">הגדרות</h3>
  <section class="settings">
    <div class="set"><span>מילים חדשות ביום</span><div class="stepper"><button id="np-m">−</button><b>${st.newPerDay}</b><button id="np-p">+</button></div></div>
    ${toggle("autoplay", "הקראה אוטומטית בכרטיסיות", st.autoplay)}
    ${toggle("highlight", "סימון מילים חדשות/בלמידה בסיפור", st.highlight)}
    ${toggle("reverseMature", "לפעמים להפוך כרטיס בשל (אנגלית ← ספרדית)", st.reverseMature)}
    <div class="set"><span>קול הקראה</span><span class="muted small" dir="ltr">${esc(voiceLabel())}</span></div>
    <div class="set"><button class="btn ghost small" id="pg-voice">🔊 בדיקת קול</button></div>
  </section>
  <h3 class="h3">גיבוי</h3>
  <section class="settings">
    <div class="set"><span>שמירה</span><span class="muted small">${Store.status === "cloud" ? "☁️ בחשבון Claude + בטלפון" : "📱 שמור בטלפון הזה" + (INSTALL.persisted ? " (קבוע)" : "")}</span></div>
    ${Store.status !== "cloud" ? `<div class="set"><span class="muted small">הנתונים נשמרים רק במכשיר הזה ונשארים גם כשהאפליקציה מתעדכנת. מדי פעם כדאי ללחוץ "העתק גיבוי" ולשמור את הטקסט אצלך.</span></div>` : ""}
    <div class="set"><button class="btn ghost small" id="pg-copy">העתק גיבוי</button><button class="btn ghost small" id="pg-restore">שחזר מגיבוי</button></div>
    <textarea id="pg-ta" hidden placeholder="הדבק כאן את הגיבוי ולחץ שוב על שחזר" dir="ltr"></textarea>
  </section>
  <p class="muted small center">Cuentos y Tarjetas · אלגוריתם FSRS-4.5 · ${allStories().length} סיפורים · ${Object.keys(DEFS).length} מילות יעד</p>`;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { S.level = +b.dataset.l; save(); go("progress"); });
  $("#pg-test").onclick = () => { PT = null; go("placement"); };
  $("#np-m").onclick = () => { st.newPerDay = Math.max(3, st.newPerDay - 1); save(); renderProgress(); };
  $("#np-p").onclick = () => { st.newPerDay = Math.min(20, st.newPerDay + 1); save(); renderProgress(); };
  document.querySelectorAll(".tgl").forEach(b => b.onclick = () => { st[b.dataset.k] = !st[b.dataset.k]; save(); renderProgress(); });
  $("#pg-voice").onclick = () => speak("Hola Dror, ¿cómo estás? Vamos a leer un cuento.", st.rate);
  $("#pg-copy").onclick = async () => {
    const data = JSON.stringify({ state: S, gen: GEN });
    try { await navigator.clipboard.writeText(data); toast("הגיבוי הועתק"); }
    catch (e) { const ta = $("#pg-ta"); ta.hidden = false; ta.value = data; ta.select(); toast("העתק את הטקסט ידנית"); }
  };
  $("#pg-restore").onclick = () => {
    const ta = $("#pg-ta");
    if (ta.hidden || !ta.value.trim()) { ta.hidden = false; ta.value = ""; ta.focus(); return; }
    try {
      const j = JSON.parse(ta.value);
      S = normalize(j.state || j); GEN = j.gen || GEN;
      lsSet("cyt_gen", GEN);
      if (Store.col) for (const id of Object.keys(GEN)) Store.col.doc("story_" + id).set(GEN[id]).catch(() => { });
      buildDefs(); save(); toast("שוחזר ✓"); go("home");
    } catch (e) { toast("הגיבוי לא תקין"); }
  };
}
function toggle(k, label, on) { return `<div class="set"><span>${label}</span><button class="tgl ${on ? "on" : ""}" data-k="${k}" role="switch" aria-checked="${on}"><i></i></button></div>`; }

/* ============ install (GitHub Pages / PWA) ============ */
const INSTALL = { prompt: null, persisted: false };
const inClaude = () => !!(window.claude && typeof window.claude.use === "function");
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL.prompt = e; if (VIEW === "home") renderHome(); });
window.addEventListener("appinstalled", () => { INSTALL.prompt = null; if (VIEW === "home") renderHome(); });
function installCard() {
  if (inClaude() || isStandalone() || S.installHidden || location.protocol === "file:") return "";
  return `<section class="install"><b>📲 להתקין כאפליקציה בטלפון</b>
    ${INSTALL.prompt ? `<p>בלחיצה אחת — ואז היא תיפתח מהמסך הראשי כמו כל אפליקציה.</p><button class="btn primary" id="h-install">התקן</button>`
      : isIOS() ? `<p>בספארי: כפתור השיתוף <b>⬆️</b> ← <b>"הוסף למסך הבית"</b>.</p>`
      : `<p>בכרום: תפריט <b>⋮</b> ← <b>"הוספה למסך הבית"</b> / <b>"התקנת אפליקציה"</b>.</p>`}
    <button class="btn ghost small" id="h-install-x">הסתר</button></section>`;
}
function setupPWA() {
  if (inClaude() || (location.protocol !== "https:" && location.hostname !== "localhost")) return;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(e => console.warn("sw", e));
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok => { INSTALL.persisted = ok; }); } catch (e) { }
}

/* ============ boot ============ */
function boot() {
  S = normalize(lsGet("cyt_state"));
  GEN = lsGet("cyt_gen") || {};
  buildDefs(); rolloverDay();
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));
  $("#scrim").onclick = closeSheet;
  go(S.placement.done ? "home" : "welcome");
  setupPWA();
  initCloud();
}
document.addEventListener("DOMContentLoaded", boot);

/* ============ verbs: study + drill ============ */
let VSEL = { tense: "presente", verb: "tener" };
let CJ_SET = null; // selected tenses for drill
function tenseInfo(k) { return TENSES[k] || EXTRA_TENSES[k]; }
function tenseStat(k) { const r = S.conj[k]; return r && r.n ? Math.round(r.c / r.n * 100) : null; }
const useVos = () => S.voseo !== false;
function formsFor(v, k) { return allForms(v, k, useVos()); }
const short = k => ({ preterito: "Pretérito", perfecto: "Perfecto", gerundio: "Estar + -ando", ira: "Ir a + infinitivo", pluscuamperfecto: "Pluscuamperfecto", subjuntivo: "Subjuntivo" }[k] || TENSES[k].es);
function renderVerbs() {
  if (!CJ_SET) CJ_SET = new Set((S.conjSet && S.conjSet.length ? S.conjSet : DEFAULT_CJ).filter(k => TENSES[k]));
  const all = TENSE_ORDER;
  const t = tenseInfo(VSEL.tense);
  const v = VERBS.find(x => x.inf === VSEL.verb) || VERBS[0];
  const forms = formsFor(v, VSEL.tense);
  main().innerHTML = `
  <h2 class="h">זמנים ונטיות</h2>
  <section class="cj-drill">
    <div class="eyebrow">תרגול נטיות — בחר זמנים</div>
    <div class="chips">${TENSE_ORDER.map(k => { const st = tenseStat(k); return `<button class="chip ${CJ_SET.has(k) ? "on" : ""}" data-k="${k}"><span class="es" dir="ltr">${short(k)}</span>${st !== null ? `<small>${st}%</small>` : ""}</button>`; }).join("")}</div>
    <div class="seg two"><button class="${(S.conjVerbs || "all") === "all" ? "on" : ""}" data-vs="all">כל הפעלים</button><button class="${S.conjVerbs === "irr" ? "on" : ""}" data-vs="irr">רק לא־סדירים</button><button class="${S.conjVerbs === "reg" ? "on" : ""}" data-vs="reg">רק סדירים</button></div>
    <button class="vos-tgl" id="vos-tgl"><span class="tgl ${useVos() ? "on" : ""}"><i></i></span><span>🇦🇷 לכלול <b class="es">vos</b> (vos tenés, vos sos) — ארגנטינה ומדג׳ין</span></button>
    <button class="btn primary big" id="cj-start">⏱️ התחל תרגול (15 שאלות)</button>
  </section>
  <h3 class="h3">למידה: איך בונים כל זמן</h3>
  <div class="tabs">${all.map(k => `<button class="tab ${VSEL.tense === k ? "on" : ""}" data-t="${k}"><span class="es" dir="ltr">${short(k)}</span><small>${tenseInfo(k).he}</small></button>`).join("")}</div>
  <section class="tense-card">
    <div class="tc-head"><div><div class="tc-name es" dir="ltr">${t.es}</div><div class="muted small">${t.he} · <span dir="ltr">${esc(t.en)}</span></div></div>${tenseStat(VSEL.tense) !== null ? `<div class="score">${tenseStat(VSEL.tense)}%</div>` : ""}</div>
    <p><b>מתי:</b> ${t.use}</p>
    ${t.form ? `<p><b>איך בונים:</b></p><div class="tc-form es" dir="ltr">${t.form.split(" · ").map(x => `<div>${esc(x)}</div>`).join("")}</div>` : ""}
    ${t.markers ? `<p><b>מילות זמן:</b> <span class="es" dir="ltr">${t.markers}</span></p>` : ""}
    <div class="tc-ex es" dir="ltr">${esc(t.ex)} <button class="icon spk inline" id="tc-ex">🔊</button></div>
  </section>
  <div class="verb-pick">${VERBS.map(x => `<button class="vchip ${x.inf === v.inf ? "on" : ""} ${x.irr ? "irr" : ""}" data-v="${x.inf}">${x.inf}</button>`).join("")}</div>
  <section class="conj-table">
    <div class="ct-head"><span class="es" dir="ltr"><b>${v.inf}</b> · ${esc(v.en)}</span>${v.irr ? `<span class="tag learning">לא סדיר</span>` : `<span class="tag stable">סדיר</span>`}</div>
    ${allPersons(useVos()).map((p, i) => { const f = VSEL.tense === "gerundio" && v.inf === "estar" ? "—" : forms[i]; return `<button class="ct-row ${p.k === 5 ? "vos" : ""}" data-say="${esc(p.es[0] + " " + f)}"><span class="ct-p es" dir="ltr">${p.es.join(" / ")}</span><span class="ct-f es" dir="ltr">${esc(f)}</span><span class="ct-he">${p.he}</span></button>`; }).join("")}
    <div class="muted small">הקש על שורה כדי לשמוע. אין vosotros — כמו בכל אמריקה הלטינית.${useVos() ? " ב־vos רק ההווה שונה (hablás, tenés, sos); בשאר הזמנים משתמשים בצורה של tú." : ""}</div>
  </section>`;
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { const k = b.dataset.k; CJ_SET.has(k) ? CJ_SET.delete(k) : CJ_SET.add(k); if (!CJ_SET.size) CJ_SET.add(k); S.conjSet = [...CJ_SET]; save(); renderVerbs(); });
  $("#vos-tgl").onclick = () => { S.voseo = !useVos(); save(); renderVerbs(); };
  document.querySelectorAll("[data-vs]").forEach(b => b.onclick = () => { S.conjVerbs = b.dataset.vs; save(); renderVerbs(); });
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { VSEL.tense = b.dataset.t; renderVerbs(); });
  document.querySelectorAll(".vchip").forEach(b => b.onclick = () => { VSEL.verb = b.dataset.v; renderVerbs(); });
  document.querySelectorAll(".ct-row").forEach(b => b.onclick = () => speak(b.dataset.say, 0.85));
  $("#tc-ex").onclick = () => speak(t.ex, S.settings.rate);
  $("#cj-start").onclick = () => startConj();
}

let CJ = null;
function pickVerbs() {
  const m = S.conjVerbs || "all";
  return VERBS.filter(v => m === "all" || (m === "irr" ? v.irr : !v.irr));
}
function makeQuestion(tenses, verbs) {
  const t = tenses[Math.floor(Math.random() * tenses.length)];
  const vpool = t === "gerundio" ? verbs.filter(x => !x.noGer) : verbs;
  const v = (vpool.length ? vpool : verbs)[Math.floor(Math.random() * (vpool.length || verbs.length))];
  const vos = useVos();
  const persons = allPersons(vos);
  const pi = vos && Math.random() < 0.22 ? 5 : Math.floor(Math.random() * 5);
  const pron = persons[pi].es[Math.floor(Math.random() * persons[pi].es.length)];
  const forms = allForms(v, t, vos);
  const ans = forms[pi];
  const pool = new Set();
  forms.forEach((f, i) => { if (i !== pi) pool.add(f); });
  const others = TENSE_ORDER.filter(x => x !== t).map(x => allForms(v, x, vos)[pi]);
  const distract = shuffle([...pool].filter(f => f !== ans)).slice(0, 2).concat(shuffle(others.filter(f => f !== ans && !pool.has(f))).slice(0, 1));
  while (distract.length < 3) { const f = shuffle(others.concat([...pool]))[0]; if (f !== ans && !distract.includes(f)) distract.push(f); else break; }
  const marker = TENSES[t].marker;
  return { t, v, pi, pron, ans, opts: shuffle([ans, ...distract.slice(0, 3)]), before: `${marker} ${pron}${TENSES[t].mid ? " " + TENSES[t].mid : ""}`, after: v.c };
}
function startConj() {
  const tenses = [...CJ_SET];
  const verbs = pickVerbs();
  const q = []; for (let i = 0; i < 15; i++) q.push(makeQuestion(tenses, verbs));
  CJ = { q, i: 0, c: 0, wrong: 0, tenses };
  go("conj");
}
function renderConj() {
  if (!CJ) return go("verbs");
  if (CJ.i >= CJ.q.length) return renderConjEnd();
  const q = CJ.q[CJ.i];
  const T = TENSES[q.t];
  main().innerHTML = `
  <div class="ses-top"><button class="icon" id="cj-x">✕</button><div class="prog"><div style="width:${Math.round(CJ.i / CJ.q.length * 100)}%"></div></div><span class="muted small">${CJ.i + 1}/${CJ.q.length}</span></div>
  <section class="cjq">
    <div class="cj-meta"><span class="tag new es" dir="ltr">${short(q.t)}</span><span class="muted small">${T.he} · <span dir="ltr">${esc(T.en)}</span></span></div>
    <div class="cj-verb es" dir="ltr">${q.v.inf} <span class="muted small">· ${esc(q.v.en)}</span></div>
    <div class="cj-sent es" dir="ltr">${esc(q.before)} <span class="blank" id="cj-blank">_____</span> ${esc(q.after)}.</div>
    <div class="pt-opts">${q.opts.map(o => `<button class="opt es" dir="ltr" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
    <div id="cj-fb"></div>
  </section>`;
  $("#cj-x").onclick = () => { CJ = null; go("verbs"); };
  let answered = false;
  document.querySelectorAll(".cjq .opt").forEach(b => b.onclick = () => {
    if (answered) return; answered = true;
    const ok = b.dataset.o === q.ans;
    const r = S.conj[q.t] || (S.conj[q.t] = { c: 0, n: 0 }); r.n++; if (ok) r.c++;
    if (ok) CJ.c++; else { CJ.wrong++; CJ.q.splice(Math.min(CJ.q.length, CJ.i + 4), 0, Object.assign({}, q, { opts: shuffle(q.opts) })); }
    bumpStreak(); save();
    document.querySelectorAll(".cjq .opt").forEach(x => { x.disabled = true; if (x.dataset.o === q.ans) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    const full = `${q.before} ${q.ans} ${q.after}.`;
    $("#cj-blank").textContent = q.ans; $("#cj-blank").classList.add(ok ? "ok" : "bad");
    $("#cj-fb").innerHTML = `<div class="cj-fb ${ok ? "ok" : "bad"}"><b>${ok ? "¡Correcto!" : "התשובה: " + esc(q.ans)}</b>
      <div class="muted small">${allPersons(true)[q.pi].he} · ${T.he}</div>
      <div class="cj-row"><button class="pill" id="cj-say">🔊 הקרא</button><button class="pill" id="cj-tab">📋 כל הטבלה</button></div>
      <div id="cj-table"></div>
      <button class="btn primary big" id="cj-next">הבא ←</button></div>`;
    $("#cj-say").onclick = () => speak(full, S.settings.rate);
    $("#cj-tab").onclick = () => { const f = allForms(q.v, q.t, useVos()); $("#cj-table").innerHTML = `<div class="mini-tab">${allPersons(useVos()).map((p, i) => `<div class="${i === q.pi ? "hl" : ""}"><span class="es" dir="ltr">${p.es[0]}</span><b class="es" dir="ltr">${esc(f[i])}</b></div>`).join("")}</div>`; };
    $("#cj-next").onclick = () => { CJ.i++; renderConj(); };
    if (S.settings.autoplay) speak(full, S.settings.rate);
  });
}
function renderConjEnd() {
  const s = CJ;
  const first = s.q.length - s.wrong;
  main().innerHTML = `<section class="done">
    <div class="done-emoji">⏱️</div>
    <h2 dir="ltr">¡Buen trabajo!</h2>
    <p>${s.c} תשובות נכונות מתוך ${s.q.length} שאלות.</p>
    <div class="pt-res">${s.tenses.slice(0, 6).map(k => `<div><span class="es" dir="ltr">${short(k)}</span><b>${tenseStat(k) ?? "—"}%</b></div>`).join("")}</div>
    <button class="btn primary big" id="cj-again">🔁 עוד סבב</button>
    <button class="btn ghost" id="cj-back">חזרה לזמנים</button>
  </section>`;
  $("#cj-again").onclick = () => startConj();
  $("#cj-back").onclick = () => { CJ = null; go("verbs"); };
}

</script>
